name: Ingesta camiones Agroentregas (JSON público → Supabase)

# Mantiene al día la tabla camiones_plantas con la entrada diaria de camiones por planta, empresa y
# grano de Agroentregas (C24 del backlog maestro, docs/negocio/10_fuente_camiones_agroentregas.md).
#
# Por qué DOS corridas por día: el endpoint es una foto del día EN CURSO (ignora cualquier
# parámetro de fecha) y el total va creciendo mientras entran camiones, así que no hay forma de
# corregir el día de ayer una vez que la fuente pasó de fecha. La corrida de las 22:00 ART toma el
# día casi cerrado; la de las 18:00 ART es la red de seguridad —si la tardía falla o la fuente ya
# rotó de fecha, ese día igual quedó guardado con un valor razonable en vez de perderse—. El upsert
# es por (fecha, planta, producto) y la fecha la dicta la propia respuesta, así que repetir corridas
# es idempotente y la última siempre gana.
#
# Corre TODOS los días (no solo L-V): los puertos reciben camiones los sábados (y el domingo flojo
# también es dato real). Los `schedule` de GitHub Actions corren desde la rama default del repo.
#
# Fix 03/08/2026: los 2 crons estaban en punto (":00"), el minuto más congestionado de GitHub
# Actions a nivel global (mismo hallazgo que ya documentaba `ingest-noticias.yml`) — medido en runs
# reales: el de "0 1 * * *" (nominal 22:00 ART) llegaba a disparar ~3,3-3,5h tarde, cruzando la
# medianoche ART. Para el segundo cron eso rompía la corrida de VERDAD (no solo ruido): Agroentregas
# es "foto del día en curso" — al cruzar la medianoche la colección "Camiones" de HOY viene vacía (no
# entró un solo camión todavía) y el guard anti-falso-verde fallaba la corrida cada noche, con mail de
# alerta incluido. Fix: además de sacar los 2 crons del minuto ":00", el segundo se adelanta a las
# 20:15 ART (antes 22:00) para dejar margen real ante ese mismo retraso sin cruzar la medianoche.

# El GITHUB_TOKEN no se usa (todo va por secrets de Supabase) → mínimo privilegio (E5 #12d).
permissions:
  contents: read

on:
  schedule:
    - cron: "12 21 * * *" # 18:12 ART — red de seguridad
    - cron: "18 23 * * *" # 20:18 ART — el día casi cerrado, con margen ante el retraso de GitHub
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo imprimir lo que traería, sin escribir en Supabase."
        type: boolean
        default: false

concurrency:
  group: ingest-camiones-agroentregas
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - name: Ingesta
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node scripts/ingest-camiones-agroentregas.mjs --dry-run
          else
            node scripts/ingest-camiones-agroentregas.mjs
          fi
      - name: Avisar por mail si falló (E5 #7)
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/alerta-mail.mjs --workflow "${{ github.workflow }}" --run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
