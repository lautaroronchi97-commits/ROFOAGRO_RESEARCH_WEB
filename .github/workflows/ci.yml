name: CI

# El GITHUB_TOKEN no se usa (todo va por secrets de Supabase) → mínimo privilegio (E5 #12d).
permissions:
  contents: read

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # No bloqueante a propósito (C29, 01/08/2026): hoy hay 4 altas, TODAS transitivas de
      # `next` (postcss/sharp) — el único fix pide `--force` con un bump de Next fuera del
      # rango declarado, y este repo corre una versión de Next con cambios de breaking
      # documentados (AGENTS.md) → bumpearla es una decisión de Lautaro, no algo para que un
      # gate de CI fuerce solo. Queda visible en el log de cada run igual.
      - run: npm audit --audit-level=high
        continue-on-error: true
